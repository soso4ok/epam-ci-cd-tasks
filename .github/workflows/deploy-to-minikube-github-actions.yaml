name: Deploy to Minikube using GitHub Actions

on: [push]

jobs:
  job1:
    runs-on: ubuntu-latest
    name: build Node.js Docker Image and deploy to minikube
    env:
      IMAGE_NAME: devopshint/node-app:ci
    steps:
      - uses: actions/checkout@v4
      - name: Start minikube
        uses: medyagh/setup-minikube@master
      - name: Try the cluster !
        run: kubectl get pods -A
      - name: Build image
        run: |
          export SHELL=/bin/bash
          eval $(minikube -p minikube docker-env)
          docker build -f ./Dockerfile -t "$IMAGE_NAME" .
          echo -n "verifying images:"
          docker images | grep "node-app"
      - name: Deploy to minikube
        run: |
          kubectl apply -f k8s-node-app.yaml
          kubectl rollout status deployment/nodejs-app --timeout=180s
      - name: Test service URLs
        run: |
          minikube service list
          SERVICE_URL=$(minikube service nodejs-app --url)
          echo "$SERVICE_URL"
          curl -fsS "$SERVICE_URL/"
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe deployment nodejs-app || true
          kubectl describe pods -l app=nodejs-app || true
          kubectl logs -l app=nodejs-app --all-containers --tail=200 || true
